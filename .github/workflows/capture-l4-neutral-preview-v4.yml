name: Capture L4 neutral-color preview v4

on:
  push:
    branches:
      - preview/l4-neutral-screenshot-20260818
    paths:
      - .github/workflows/capture-l4-neutral-preview-v4.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      PREVIEW_BRANCH: preview/l4-neutral-screenshot-20260818

    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/l4-neutral-screenshot-20260818

      - name: Apply preview changes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-neutral-preview.py
          git diff --check

      - name: Start application
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d --build
          for i in $(seq 1 150); do
            if curl -fsS http://localhost:8082/auth/signin >/dev/null 2>&1 && \
               curl -fsS http://localhost:8080/ >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/l4-capture
          cd /tmp/l4-capture
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Capture and publish screenshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cat > /tmp/l4-capture/capture.mjs <<'JS'
          import { chromium } from 'playwright'

          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage({
            viewport: { width: 1600, height: 1000 },
            deviceScaleFactor: 1,
          })

          await page.goto('http://localhost:8082/l4-opcpa', {
            waitUntil: 'domcontentloaded',
            timeout: 60_000,
          })

          if (page.url().includes('/auth/signin')) {
            await page.getByLabel('Username').fill('test')
            await page.getByLabel('Password').fill('test')
            await page.getByRole('button', { name: 'Sign In' }).click()
            await page.waitForTimeout(2_000)
            await page.goto('http://localhost:8082/l4-opcpa', {
              waitUntil: 'domcontentloaded',
              timeout: 60_000,
            })
          }

          await page.getByText('NL2', { exact: true }).waitFor({ timeout: 60_000 })
          await page.getByText('is CLOSED', { exact: true }).waitFor({ timeout: 60_000 })
          await page.waitForTimeout(3_000)

          await page.screenshot({
            path: process.cwd() + '/artifacts/l4-neutral-preview-final.png',
            fullPage: true,
          })
          await browser.close()
          JS

          node /tmp/l4-capture/capture.mjs 2>&1 | tee /tmp/v4-capture.log

          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/artifacts/l4-neutral-preview-final.png" \
            -f message='chore: publish final L4 neutral-color screenshot [skip ci]' \
            -f branch="$PREVIEW_BRANCH" \
            -f content="$(base64 -w0 artifacts/l4-neutral-preview-final.png)"

      - name: Publish diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          {
            printf 'workflow failed at %s\n\n' "$(date -u +%FT%TZ)"
            if [ -f /tmp/v4-capture.log ]; then
              printf '%s\n' '--- capture ---'
              cat /tmp/v4-capture.log
            fi
            printf '%s\n' '--- compose status ---'
            docker compose ps 2>&1
            printf '%s\n' '--- compose logs ---'
            docker compose logs --no-color 2>&1
          } > /tmp/v4-failure.log
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/artifacts/v4-failure.log" \
            -f message='chore: publish final screenshot diagnostics [skip ci]' \
            -f branch="$PREVIEW_BRANCH" \
            -f content="$(base64 -w0 /tmp/v4-failure.log)" || true
