name: Capture L4 neutral-color preview

on:
  push:
    branches:
      - preview/l4-neutral-screenshot-20260818
    paths:
      - .github/workflows/capture-l4-neutral-preview.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/l4-neutral-screenshot-20260818

      - name: Apply the neutral-color correction for the preview
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}")
              file.write_text(text.replace(old, new, 1))

          def replace_block_property(path: str, selector: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              start = text.find(selector)
              if start < 0:
                  raise SystemExit(f"selector not found in {path}: {selector}")
              end = text.find('}', start)
              if end < 0:
                  raise SystemExit(f"unterminated block in {path}: {selector}")
              block = text[start:end + 1]
              if new in block:
                  return
              if old not in block:
                  raise SystemExit(f"property not found in {path}: {selector}")
              block = block.replace(old, new, 1)
              file.write_text(text[:start] + block + text[end + 1:])

          globals_path = 'frontend/src/app/globals.css'
          replace_once(
              globals_path,
              "  --color-nav-background: var(--color-gray-800);\n\n  /* CSI-782",
              "  --color-nav-background: var(--color-gray-800);\n\n"
              "  --color-action-neutral: var(--color-surface-lighter);\n"
              "  --color-action-neutral-hover: var(--color-surface);\n\n"
              "  /* CSI-782",
          )
          replace_once(
              globals_path,
              "  --color-surface: var(--color-negative-neutral);\n  --color-border: var(--color-text);",
              "  --color-surface: var(--color-negative-neutral);\n"
              "  --color-action-neutral: var(--color-negative-neutral);\n"
              "  --color-action-neutral-hover: var(--color-positive-neutral);\n"
              "  --color-border: var(--color-text);",
          )

          replace_once(
              'frontend/src/components/hmi/laser-panel/GeneralSection.tsx',
              '            onTone="negative-neutral"\n            offTone="positive-neutral"',
              '            onTone="positive-neutral"\n            offTone="negative-neutral"',
          )
          replace_once(
              'frontend/src/components/hmi/laser-panel/RegenSection.tsx',
              '            onLabel="is ON"\n            offLabel="is OFF"\n          />',
              '            onLabel="is ON"\n            offLabel="is OFF"\n            offTone="negative-neutral"\n          />',
          )

          replace_once(
              'frontend/src/components/hmi/laser-panel/FlashlampsSection.tsx',
              """function toneForState(
            state: FlashlampState,
            count: number,
          ): 'positive-important' | 'negative-neutral' | 'negative-important' | undefined {
            if (count === 0) return undefined
            if (state === 'RUN') return 'positive-important'
            if (state === 'FAIL') return 'negative-important'
            return 'negative-neutral'
          }
          """,
              """function toneForState(
            state: FlashlampState,
            count: number,
          ): 'positive-neutral' | 'negative-important' {
            if (state === 'FAIL' && count > 0) return 'negative-important'
            return 'positive-neutral'
          }
          """,
          )

          replace_block_property(
              'frontend/src/components/hmi/controls/CogToggle.module.css',
              '.button {',
              'background: var(--color-surface-lighter);',
              'background: var(--color-action-neutral);',
          )
          replace_block_property(
              'frontend/src/components/hmi/controls/CogToggle.module.css',
              '.button:hover {',
              'background: var(--color-surface);',
              'background: var(--color-action-neutral-hover);',
          )

          action = Path('frontend/src/components/hmi/controls/ActionButton.module.css')
          text = action.read_text()
          text = text.replace('background: var(--color-surface-lighter);', 'background: var(--color-action-neutral);')
          text = text.replace('background: var(--color-surface);', 'background: var(--color-action-neutral-hover);')
          action.write_text(text)

          for selector in ['.chip {', '.confirm {']:
              replace_block_property(
                  'frontend/src/components/hmi/controls/PresetIntegerInput.module.css',
                  selector,
                  'background: var(--color-surface-lighter);',
                  'background: var(--color-action-neutral);',
              )
          for selector in ['.chip:hover:not(:disabled) {', '.confirm:hover:not(:disabled) {']:
              replace_block_property(
                  'frontend/src/components/hmi/controls/PresetIntegerInput.module.css',
                  selector,
                  'background: var(--color-surface);',
                  'background: var(--color-action-neutral-hover);',
              )

          replace_block_property(
              'frontend/src/components/hmi/laser-panel/WaveformSelect.module.css',
              '.load {',
              'background: var(--color-surface-lighter);',
              'background: var(--color-action-neutral);',
          )
          replace_block_property(
              'frontend/src/components/hmi/laser-panel/WaveformSelect.module.css',
              '.load:hover:not(:disabled) {',
              'background: var(--color-surface);',
              'background: var(--color-action-neutral-hover);',
          )

          sections = 'frontend/src/components/hmi/laser-panel/sections.module.css'
          replace_block_property(
              sections,
              '.waveformActionToggle {',
              'background: var(--color-surface-lighter);',
              'background: var(--color-action-neutral);',
          )
          replace_block_property(
              sections,
              '.waveformActionToggle:hover {',
              'background: var(--color-surface);',
              'background: var(--color-action-neutral-hover);',
          )
          file = Path(sections)
          text = file.read_text()
          rule = """.flashlampCell[data-tone='positive-neutral'] {
            background: var(--color-surface-lighter);
            border-color: var(--color-text);
          }

          """
          marker = ".flashlampCell[data-tone='positive-important'] {"
          if rule not in text:
              if marker not in text:
                  raise SystemExit('flashlamp CSS insertion anchor not found')
              file.write_text(text.replace(marker, rule + marker, 1))
          PY

      - name: Build and start the application
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d --build

          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8082/api/auth/signin >/dev/null 2>&1 && \
               curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done

          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/l4-capture
          cd /tmp/l4-capture
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Capture the running UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cat > /tmp/l4-capture/capture.mjs <<'JS'
          import { chromium } from 'playwright'

          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage({
            viewport: { width: 1600, height: 1000 },
            deviceScaleFactor: 1,
          })

          await page.goto('http://127.0.0.1:8082/l4-opcpa', {
            waitUntil: 'domcontentloaded',
            timeout: 60_000,
          })

          if (page.url().includes('/auth/signin')) {
            await page.getByLabel('Username').fill('test')
            await page.getByLabel('Password').fill('test')
            await page.getByRole('button', { name: 'Sign In' }).click()
            await page.waitForTimeout(1_500)
            await page.goto('http://127.0.0.1:8082/l4-opcpa', {
              waitUntil: 'domcontentloaded',
              timeout: 60_000,
            })
          }

          await page.getByText('NL2', { exact: true }).waitFor({ timeout: 60_000 })
          await page.getByText('is CLOSED', { exact: true }).waitFor({ timeout: 60_000 })
          await page.waitForTimeout(3_000)

          await page.screenshot({
            path: process.cwd() + '/artifacts/l4-neutral-preview.png',
            fullPage: true,
          })

          await browser.close()
          JS
          node /tmp/l4-capture/capture.mjs

      - name: Commit screenshot to the temporary preview branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f artifacts/l4-neutral-preview.png
          git commit -m "chore: capture L4 neutral-color preview [skip ci]"
          git push origin HEAD:preview/l4-neutral-screenshot-20260818

      - name: Show service logs on failure
        if: failure()
        shell: bash
        run: docker compose logs --no-color || true
